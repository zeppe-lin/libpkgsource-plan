name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC shared
            cc: gcc
            cxx: g++
            mode: shared
            man_pages: enabled
          - name: GCC static
            cc: gcc
            cxx: g++
            mode: static
            man_pages: disabled
          - name: Clang shared
            cc: clang
            cxx: clang++
            mode: shared
            man_pages: disabled
          - name: Clang static
            cc: clang
            cxx: clang++
            mode: static
            man_pages: disabled
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out libpkgsource-plan
        uses: actions/checkout@v4

      - name: Check out libpkgsource 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgsource
          ref: v3.0.0
          path: dependencies/libpkgsource

      - name: Check out libpkgplan 0.2.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgplan
          ref: v0.2.0
          path: dependencies/libpkgplan

      - name: Check out libpkgimage 0.3.0 boundary
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgimage
          ref: e1f6dfd8cc4bfeb2f8da44345d8ec6368281c6e0
          path: dependencies/libpkgplan/subprojects/libpkgimage

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            clang-format-17 \
            binutils \
            doxygen \
            libarchive-dev \
            libssl-dev \
            mandoc \
            meson \
            ninja-build \
            pandoc \
            pkg-config

      - name: Build and install owner libraries
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix"
          meson setup dependencies/libpkgsource/build \
            dependencies/libpkgsource \
            --prefix="$prefix" \
            --libdir=lib \
            -Ddefault_library=${{ matrix.mode }} \
            -Dlink_mode=${{ matrix.mode }} \
            -Dtests=disabled \
            -Dman_pages=disabled \
            -Dwerror=true
          meson compile -C dependencies/libpkgsource/build
          meson install -C dependencies/libpkgsource/build

          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          meson setup dependencies/libpkgplan/build \
            dependencies/libpkgplan \
            --prefix="$prefix" \
            --libdir=lib \
            -Ddefault_library=${{ matrix.mode }} \
            -Dlink_mode=${{ matrix.mode }} \
            -Dtests=disabled \
            -Dreference_tools=disabled \
            -Dman_pages=disabled \
            -Dwerror=true
          meson compile -C dependencies/libpkgplan/build
          meson install -C dependencies/libpkgplan/build

          echo "PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"

      - name: Configure, build, and test
        run: |
          meson setup build \
            --prefix="$PREFIX" \
            --libdir=lib \
            -Ddefault_library=${{ matrix.mode }} \
            -Dlink_mode=${{ matrix.mode }} \
            -Dman_pages=${{ matrix.man_pages }} \
            -Dsha256_provider=openssl \
            -Dwerror=true
          meson compile -C build
          meson test -C build --print-errorlogs

      - name: Qualify public API documentation
        if: matrix.name == 'GCC shared'
        run: doxygen Doxyfile

      - name: Qualify manuals
        if: matrix.man_pages == 'enabled'
        run: find build/docs/man -type f -name '*.3' -exec mandoc -Tlint {} +

      - name: Install
        run: meson install -C build

      - name: Qualify installed consumer and metadata closure
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ '${{ matrix.mode }}' == static ]]; then
            flags+=(--static)
          fi
          pkg-config "${flags[@]}" --cflags --libs libpkgsource-plan \
            | tee installed.flags
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            tests/public/umbrella_header_test.cpp \
            $(pkg-config "${flags[@]}" --cflags --libs libpkgsource-plan) \
            -o installed-consumer
          ./installed-consumer

      - name: Audit shared dependency boundary
        if: matrix.mode == 'shared'
        shell: bash
        run: |
          set -euo pipefail
          library=$(find build -type f -name 'libpkgsource-plan.so.*' \
            ! -type l -print -quit)
          readelf -d "$library" | tee adapter.dynamic
          grep -F 'Library soname: [libpkgsource-plan.so.1]' adapter.dynamic
          grep -F 'Shared library: [libpkgsource.so.3]' adapter.dynamic
          grep -F 'Shared library: [libpkgplan.so.1]' adapter.dynamic
          grep -E 'Shared library: \[libcrypto\.so' adapter.dynamic
          ! grep -E 'libyaml|libpkgsource-codec' adapter.dynamic

  sanitizers:
    name: ${{ matrix.name }} sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgsource
          ref: v3.0.0
          path: dependencies/libpkgsource
      - uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgplan
          ref: v0.2.0
          path: dependencies/libpkgplan
      - uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgimage
          ref: e1f6dfd8cc4bfeb2f8da44345d8ec6368281c6e0
          path: dependencies/libpkgplan/subprojects/libpkgimage

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils clang libarchive-dev libssl-dev meson ninja-build pkg-config

      - name: Build sanitized owner libraries
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix"
          common=(
            --prefix="$prefix"
            --libdir=lib
            -Ddefault_library=shared
            -Dlink_mode=shared
            -Dtests=disabled
            -Dman_pages=disabled
            -Db_sanitize=address,undefined
            -Db_lundef=false
            -Dwerror=true
          )
          meson setup dependencies/libpkgsource/build \
            dependencies/libpkgsource "${common[@]}"
          meson compile -C dependencies/libpkgsource/build
          meson install -C dependencies/libpkgsource/build

          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          meson setup dependencies/libpkgplan/build \
            dependencies/libpkgplan "${common[@]}" \
            -Dreference_tools=disabled
          meson compile -C dependencies/libpkgplan/build
          meson install -C dependencies/libpkgplan/build

          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"

      - name: Configure, build, and test
        run: |
          meson setup build \
            -Ddefault_library=shared \
            -Dlink_mode=shared \
            -Dman_pages=disabled \
            -Dsha256_provider=openssl \
            -Db_sanitize=address,undefined \
            -Db_lundef=false \
            -Dwerror=true
          meson compile -C build
          meson test -C build --print-errorlogs
